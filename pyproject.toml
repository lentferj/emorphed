[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emorphed"
version = "0.1.0"
description = "A terminal browser for the E-mu Morpheus"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = ["textual>=0.40", "python-rtmidi>=1.4", "vinsynlib>=0.2.0"]

[project.scripts]
emorphed = "emorphed.entry:app"
morphcli = "emorphed.entry:cli"

[tool.setuptools.packages.find]
include = ["emu*", "emorphed*"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "detect-secrets>=1.5.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "setuptools>=83",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["emorphed", "emu"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "SIM", "UP", "C4", "PL", "RUF", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
# vinsynlib is a sibling checkout, not a published package, so ruff cannot
# tell that it is ours rather than third-party. Saying so keeps the import
# block in one piece instead of splitting the family's code away from this
# project's.
known-first-party = ["emu", "emorphed", "vinsynlib"]

# Rules ruff cannot auto-fix, suppressed per file. `S101` (assert) is allowed
# in tests by design. See README "Development checks".
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"emorphed/app.py" = [
    "B904", "PLC0415", "PLR2004", "PLW0108", "RUF012", "SIM105", "UP045",
]
"emorphed/cli.py" = [
    "B904", "B905", "C901", "PLC0415", "PLR0912", "PLR2004",
]
"emu/banks.py" = ["PLR2004", "RUF012"]
"emu/bridge.py" = ["PLC0415", "PLR0913", "S110", "S112", "SIM105"]
"emu/config.py" = ["PLR2004", "PLW0603", "UP031"]
"emu/favorites.py" = ["E501", "PLR0913", "PLR2004", "S608"]
"emu/messages.py" = ["PLR2004", "RUF012"]
"tests/test_app.py" = ["PLR2004"]
"tests/test_protocol.py" = ["PLR2004"]
"tests/test_store.py" = ["PLC0415", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true

# Third-party modules without type stubs.
[[tool.mypy.overrides]]
module = ["rtmidi"]
ignore_missing_imports = true

[tool.vulture]
min_confidence = 80
ignore_names = ["inspect"]

# No per-rule ignores are needed here. DEP001 used to excuse
# `from nano import config` -- nanosyned's package, a copy-paste slip that
# raised ImportError the moment --config was used. The code imports `emu`
# now, and tests/test_config_paths.py is what keeps it that way.
#
# vinsynlib needs no DEP002 either: it is installed editable in the venv,
# so deptry's metadata lookup finds it rather than failing on it.
