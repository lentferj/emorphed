    <text class="terminal-859788806-r1" x="0" y="20" textLength="732" clip-path="url(#terminal-859788806-line-0)">There&#160;is&#160;no&#160;name&#160;catalog&#160;yet,&#160;so&#160;the&#160;sounds&#160;show&#160;as&#160;numbers.</text><text class="terminal-859788806-r2" x="1464" y="20" textLength="12.2" clip-path="url(#terminal-859788806-line-0)">
</text><text class="terminal-859788806-r2" x="1464" y="44.4" textLength="12.2" clip-path="url(#terminal-859788806-line-1)">
</text><text class="terminal-859788806-r1" x="0" y="68.8" textLength="1464" clip-path="url(#terminal-859788806-line-2)">Scanning&#160;reads&#160;all&#160;three&#160;kinds&#160;of&#160;name&#160;back&#160;from&#160;the&#160;unit&#160;--&#160;presets,&#160;hyperpresets&#160;and&#160;midimaps&#160;--&#160;one&#160;request&#160;per&#160;kind,</text><text class="terminal-859788806-r2" x="1464" y="68.8" textLength="12.2" clip-path="url(#terminal-859788806-line-2)">
</text><text class="terminal-859788806-r1" x="0" y="93.2" textLength="1378.6" clip-path="url(#terminal-859788806-line-3)">about&#160;three&#160;requests&#160;in&#160;total.&#160;Every&#160;one&#160;of&#160;those&#160;reads&#160;is&#160;silent:&#160;nothing&#160;is&#160;selected,&#160;nothing&#160;plays,&#160;nothing&#160;is</text><text class="terminal-859788806-r2" x="1464" y="93.2" textLength="12.2" clip-path="url(#terminal-859788806-line-3)">
</text><text class="terminal-859788806-r1" x="0" y="117.6" textLength="1281" clip-path="url(#terminal-859788806-line-4)">written&#160;to&#160;the&#160;instrument,&#160;and&#160;the&#160;reading&#160;costs&#160;nothing&#160;audible&#160;on&#160;the&#160;Morpheus.&#160;It&#160;takes&#160;a&#160;few&#160;seconds.</text><text class="terminal-859788806-r2" x="1464" y="117.6" textLength="12.2" clip-path="url(#terminal-859788806-line-4)">
</text><text class="terminal-859788806-r3" x="0" y="142" textLength="195.2" clip-path="url(#terminal-859788806-line-5)">▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔</text><text class="terminal-859788806-r4" x="195.2" y="142" textLength="195.2" clip-path="url(#terminal-859788806-line-5)">▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔</text><text class="terminal-859788806-r4" x="390.4" y="142" textLength="207.4" clip-path="url(#terminal-859788806-line-5)">▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔</text><text class="terminal-859788806-r2" x="1464" y="142" textLength="12.2" clip-path="url(#terminal-859788806-line-5)">
</text><text class="terminal-859788806-r5" x="61" y="166.4" textLength="73.2" clip-path="url(#terminal-859788806-line-6)">&#160;Scan&#160;</text><text class="terminal-859788806-r6" x="231.8" y="166.4" textLength="109.8" clip-path="url(#terminal-859788806-line-6)">&#160;Not&#160;now&#160;</text><text class="terminal-859788806-r6" x="390.4" y="166.4" textLength="207.4" clip-path="url(#terminal-859788806-line-6)">&#160;Don&#x27;t&#160;ask&#160;again&#160;</text><text class="terminal-859788806-r2" x="1464" y="166.4" textLength="12.2" clip-path="url(#terminal-859788806-line-6)">
</text><text class="terminal-859788806-r7" x="0" y="190.8" textLength="195.2" clip-path="url(#terminal-859788806-line-7)">▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁</text><text class="terminal-859788806-r8" x="195.2" y="190.8" textLength="195.2" clip-path="url(#terminal-859788806-line-7)">▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁</text><text class="terminal-859788806-r8" x="390.4" y="190.8" textLength="207.4" clip-path="url(#terminal-859788806-line-7)">▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁</text><text class="terminal-859788806-r2" x="1464" y="190.8" textLength="12.2" clip-path="url(#terminal-859788806-line-7)">
