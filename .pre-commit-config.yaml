# No-AI quality gate, run on every commit.
#
# shellcheck and shfmt are intentionally absent: this repository contains no
# shell scripts (*.sh or bash/sh shebangs). Add their hooks here if that
# changes. See README "Development checks".
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # A local hook, not mirrors-mypy. That one runs mypy in an isolated
  # virtualenv built from `additional_dependencies`, and vinsynlib cannot be
  # named there: it is a sibling checkout, not a package on an index. In an
  # environment without it every `from vinsynlib...` resolved to Any, which
  # turned the strict checks this project holds itself to into errors about
  # the imports rather than about the code. Running the project's own .venv
  # is both correct and the same interpreter the rest of the gate uses.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [emorphed, emu, tests]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
